# Multi-task RoboTwin (Randomized/Clean) training config (50 tasks)
# Paths point to /path/to/datasets/StarVLA_RoboTwin-Randomized/Clean
# Each task = one dataset_key under the single ALOHA arm group.

max_action_dim: 24
max_state_dim: 24
max_views: 3
normalization_type: bounds
datasets_manifest: robotwin50_randomized_multitask.pkl

decoder_cache_size: 16
cache_shard_size_bytes: 268435456

data_groups:
  aloha_joint:
    robotwin_adjust_bottle:
      path: /path/to/datasets/StarVLA_RoboTwin-Randomized/Clean/adjust_bottle
      view_map:
        image_1: observation.images.cam_high
        image_2: observation.images.cam_left_wrist
        image_3: observation.images.cam_right_wrist
      use_delta_action: False
      process_suite: aloha_joint_angle

    robotwin_beat_block_hammer:
